version: '3.8'

services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/task-management
      JWT_SECRET: your-secret-key-change-in-production
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - mongodb
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
